<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gay Marie R. Pil — Creative Virtual Assistant &amp; Multimedia Lead</title>
    <meta
      name="description"
      content="Portfolio of Gay Marie R. Pil — Creative Virtual Assistant and Multimedia Lead. Visual content, digital assets and content operations for business owners, agencies and founders."
    />
    <meta name="theme-color" content="#0C0908" />
    <meta name="author" content="Gay Marie R. Pil" />

    <!-- Link previews. Social crawlers do not run JavaScript, so these stay
         static here and describe the site as a whole; usePageMeta handles the
         per-route title and description for browsers and search engines.
         og:image is root-relative — crawlers resolve it against the page URL.
         Add an absolute og:url once the production domain is settled. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gay Marie R. Pil" />
    <meta
      property="og:title"
      content="Gay Marie R. Pil — Creative Virtual Assistant &amp; Multimedia Lead"
    />
    <meta
      property="og:description"
      content="High-impact visual content, digital assets and streamlined workflows. I help business owners, agencies and founders elevate their visual identity and ship marketing assets on schedule."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gay Marie R. Pil — Creative Virtual Assistant and Multimedia Lead" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Gay Marie R. Pil — Creative Virtual Assistant &amp; Multimedia Lead"
    />
    <meta
      name="twitter:description"
      content="High-impact visual content, digital assets and streamlined workflows for business owners, agencies and founders."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23E23048'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='monospace' font-weight='700' font-size='13' fill='%2312090A'%3EGP%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before first paint so there is no flash of the wrong
         theme. Runs after the theme-color meta above so it can repaint the
         mobile browser chrome to match. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('gm-theme');
          theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        } catch (e) {
          /* Blocked storage or no matchMedia — dark is the default. */
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#f4efec');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
